# 堆压到 2.5G：本机同时有另一个项目在跑 Gradle + 一个模拟器，
# 4G/8G 堆会让 JVM 在 R8 阶段抢不到内存直接消失
# （daemon log: "5.6GB virtual memory requested, 2.2GB free"）。
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2560m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# REQUIRED on this machine: the Windows user name is Chinese, so the project
# path is C:/Users/<chinese>/... and AGP aborts the build with:
#   "Your project path contains non-ASCII characters. This will most likely
#    cause the build to fail on Windows."
# This flag disables that check. If the build still fails later, the robust fix
# is to move the whole project under an ASCII path (e.g. F:/dev/efficiency_app).
android.overridePathCheck=true

# Kotlin 编译守护进程也要 UTF-8：否则中文用户名在 classpath 里会被转成
# 转义成 ASCII 的 uXXXX 字面量路径，Kotlin DSL 编译直接报「jar 不存在」。
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# 本机同时有另一个项目（efficiency_app_db）在跑 Gradle，共享同一个守护进程；
# 对方执行 `gradlew --stop` 会把本项目的构建一起杀掉（表现为
# "Gradle build daemon disappeared unexpectedly"）。关掉复用后每次构建
# 起一个独立 JVM，互不干扰 —— 代价是慢一点，但不会被别人中断。
org.gradle.daemon=false
org.gradle.workers.max=2
