org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# REQUIRED on this machine: the Windows user name is Chinese, so the project
# path is C:/Users/<chinese>/... and AGP aborts the build with:
#   "Your project path contains non-ASCII characters. This will most likely
#    cause the build to fail on Windows."
# This flag disables that check. If the build still fails later, the robust fix
# is to move the whole project under an ASCII path (e.g. F:/dev/efficiency_app).
android.overridePathCheck=true
