name: efficiency_app
description: "个人效率工具 V1.0 —— 任务管理 / 富文本日记 / 扩展工具箱 / 自定义工作台"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # ===== 状态管理：Riverpod 3（手写 Provider，不引入 riverpod_generator）=====
  flutter_riverpod: ^3.4.3

  # ===== 不可变实体 + JSON 序列化（仅用于动态 JSON 实体）=====
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ===== 本地数据库：Drift (SQLite)，替代已弃坑的 Isar =====
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.20

  # ===== 路由 =====
  go_router: ^17.2.3

  # ===== 图表 / 动画 =====
  fl_chart: ^1.0.0
  flutter_animate: ^4.5.0

  # ===== 工具 =====
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.0

  # ===== 农历（公历/农历转换，禁止手写算法）=====
  lunar: ^1.6.0

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.2
  # flutter_local_notifications 的定时能力需要 TZDateTime；显式声明（不靠传递依赖）
  timezone: ^0.11.2
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===== 代码生成 =====
  build_runner: ^2.16.1
  freezed: ^4.0.0
  json_serializable: ^6.14.0
  drift_dev: ^2.35.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/sounds/   # 内置闹钟铃音（轻柔纯音乐 3-5 首）
  #   - assets/images/   # 启动 Logo、空状态插画
