name: efficiency_app
description: "效率助手 V1.2 - 安卓端个人效率工具（任务体系/日记/工具箱/自定义工作台）"
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- 状态管理：Riverpod 2.x，统一 AsyncValue 处理异步状态 ----
  flutter_riverpod: ^2.6.1

  # ---- 不可变状态类 / 实体序列化：freezed + json_serializable ----
  # 注意：freezed 4.x 需要 analyzer 14.x（与 Dart 3.13 SDK 配套），
  # 旧版 freezed 2.5.8 + analyzer 7.x 会在 build_runner 分析时崩溃。
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---- 本地数据库：Drift (SQLite)（T01 替换 Isar）----
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.42

  # ---- 全局过渡动画：flutter_animate ----
  flutter_animate: ^4.5.0

  # ---- 热量进度环：fl_chart ----
  fl_chart: ^0.69.0

  # ---- 后台持续计时：前台服务（模块1 P0 计时器，V1.1 已接入）----
  # 8.x 系列：Min Dart 3.0，与本工程 sdk >=3.3.0 兼容；Kotlin 1.9 可编译
  flutter_foreground_task: ^11.0.3

  # ---- 平台通道辅助 ----
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2

  # ---- 农历转换（朋友生日模块，V1.1 使用）----
  lunar: ^1.7.8

  # ---- 文件路径与 ZIP 备份（数据安全模块）----
  path: ^1.9.0
  archive: ^4.5.2
  workmanager: ^0.10.10
  share_plus: ^12.0.2
  flutter_slidable: ^4.0.3
  location: ^10.0.2
  flutter_local_notifications: ^22.3.2
  file_picker: ^10.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ---- 代码生成（版本与 Dart 3.13 SDK / analyzer 14.x 配套）----
  build_runner: ^2.16.2
  drift_dev: ^2.35.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # 启动页 Logo（后续在 res 中补充资源后启用）
  # assets:
  #   - assets/images/
